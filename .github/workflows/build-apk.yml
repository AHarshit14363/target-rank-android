
name: Build TARGET RANK APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build website files
        run: npm run build

      - name: Install Capacitor assets tool
        run: npm install --save-dev @capacitor/assets

      - name: Initialize Capacitor
        run: npx cap init "TARGET RANK OFFICIAL" "com.targetrank.official" --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare app icon
        run: |
          mkdir -p assets
          cp logo.png assets/icon.png
          cp logo.png assets/splash.png

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: target-rank-official-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
