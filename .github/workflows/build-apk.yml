
name: Build TARGET RANK APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build website files
        run: npm run build

      - name: Install Capacitor assets tool
        run: npm install --save-dev @capacitor/assets

      - name: Initialize Capacitor
        run: npx cap init "TARGET RANK OFFICIAL" "com.targetrank.official" --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare app icon
        run: |
          mkdir -p assets
          cp logo.png assets/icon.png
          cp logo.png assets/splash.png

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure Android deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          pattern = r'<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>'
          m = re.search(pattern, s)

          if not m:
              raise SystemExit("MainActivity not found; stopping build safely.")

          insert = """
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.targetrank.official" android:host="login-callback" />
              </intent-filter>
          """

          if "android:host=\"login-callback\"" not in s:
              s = s[:m.end()] + insert + s[m.end():]
              p.write_text(s)

          print("Android deep link configured.")
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: target-rank-official-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
